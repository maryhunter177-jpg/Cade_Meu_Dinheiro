name: ci
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore tests/CadeMeuDinheiro.UnitTests/CadeMeuDinheiro.UnitTests.csproj
      - run: dotnet build tests/CadeMeuDinheiro.UnitTests/CadeMeuDinheiro.UnitTests.csproj -c Release --no-restore
      - run: dotnet test tests/CadeMeuDinheiro.UnitTests/CadeMeuDinheiro.UnitTests.csproj -c Release --no-build --collect:"XPlat Code Coverage"
      - run: docker build -t cade-meu-dinheiro:${{ github.sha }} .
  maui-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet workload install maui
      - run: dotnet restore src/CadeMeuDinheiro.App/CadeMeuDinheiro.App.csproj -p:TargetFrameworks=net10.0-windows10.0.19041.0 -r win-x64
      - run: dotnet build src/CadeMeuDinheiro.App/CadeMeuDinheiro.App.csproj -c Release -f net10.0-windows10.0.19041.0 -r win-x64 -p:Platform=x64 --no-restore
  maui-android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: dotnet workload install maui-android
      - run: dotnet restore src/CadeMeuDinheiro.App/CadeMeuDinheiro.App.csproj -p:TargetFrameworks=net10.0-android -r android-arm64
      - run: dotnet publish src/CadeMeuDinheiro.App/CadeMeuDinheiro.App.csproj -c Release -f net10.0-android -r android-arm64 -p:TargetFrameworks=net10.0-android -p:AndroidPackageFormats=apk --no-restore
      - uses: actions/upload-artifact@v4
        with:
          name: cade-meu-dinheiro-android-arm64
          path: src/CadeMeuDinheiro.App/bin/Release/net10.0-android/android-arm64/publish/*-Signed.apk
